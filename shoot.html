<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>UCCO — the moment</title>
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ucco">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Fraunces carries the phrase; Hanken the instrument. If the network is
     down mid-shoot these fall back to system faces and the look collapses,
     so the stacks below are chosen to degrade to something defensible. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400..600&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   THE MOMENT — one file, one job.

   Built from zero for filming. The Shortcuts automation opens this,
   the moment happens, a random line lands, it resets itself.

   No home. No scenes. No archive. No settings. No tier. No director
   mode — the phrase is ALWAYS random, never chosen.

   0016 governs it: INSTRUMENT before the shutter, BROADSHEET after.
   ============================================================ */
:root{
  /* 0018 · BEIGE ON BLACK. One hue family and nothing else — the coral is gone.
     Hierarchy is value: --accent is simply the brightest cream in the room,
     --muted the deepest taupe. If a thing isn't reading, the fix is contrast
     or space, never a new swatch. */
  --void:#060606;
  --frame:#ECE4D4;
  --text-hi:#F6EFDF;
  --muted:#948B7E;
  --accent:#F6EFDF;
  --ease:cubic-bezier(.22,.61,.36,1);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',ui-serif,Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;background:var(--void);color:var(--frame);
  font-family:var(--sans);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}

/* ---------- the stage ----------
   THE PHONE IS THE WINDOW. Full bleed, always.

   The first build put a 3:2 letterbox inside the page, which breaks the moment
   rotation lock is on: the page never re-lays-out, so turning the phone just
   tilts a fixed rectangle — "a cut open card put horizontal". Filling the
   screen is correct at any angle, with or without rotation lock, and the 3:2
   crop happens at capture where it belongs. */
#stage{position:fixed;inset:0;}
.window{position:absolute;inset:0;}

.glass{position:absolute;inset:0;overflow:hidden;background:#0B0B0B;}
.glass video,.glass img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#freeze{display:none;}
#freeze.show{display:block;}

/* the 3:2 guide — what the frame will actually keep. hairline, so it reads as
   a viewfinder marking rather than a border. */
.guide{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  z-index:2;pointer-events:none;
  aspect-ratio:3/2;
  box-shadow:0 0 0 100vmax rgba(6,6,6,.5);
  outline:1px solid rgba(236,228,212,.28);
  transition:opacity .5s var(--ease);}
body.shot .guide{opacity:0;}
/* landscape fills it, so the mask has nothing to darken and the guide retires */
@media (orientation:landscape){ .guide{opacity:0;} }

/* the shade lifts like a blind — the hero beat */
.shade{position:absolute;inset:0;z-index:6;background:var(--void);
  transform:translateY(0);transition:transform 1.25s var(--ease);}
.shade.open{transform:translateY(-102%);}

.flash{position:absolute;inset:0;z-index:7;background:var(--frame);opacity:0;pointer-events:none;}
.flash.fire{animation:flash .42s var(--ease) both;}
@keyframes flash{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}

/* ---------- INSTRUMENT — before the shutter ---------- */
.sill{position:absolute;inset:0;z-index:3;border:4px solid var(--frame);pointer-events:none;}
.mull{position:absolute;z-index:3;background:var(--frame);opacity:.92;pointer-events:none;
  transition:opacity 1.1s var(--ease);}
.mull-v{left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;}
.mull-h{top:50%;left:0;right:0;height:1.5px;margin-top:-.75px;}
body.shot .mull{opacity:0;}

.ticks{position:absolute;top:0;left:0;right:0;height:20px;z-index:4;opacity:.45;
  pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(236,228,212,.55) 0 1px,transparent 1px 12px);
  -webkit-mask-image:linear-gradient(180deg,#000 30%,transparent);
          mask-image:linear-gradient(180deg,#000 30%,transparent);
  transition:opacity .4s var(--ease);}
body.shot .ticks{opacity:0;}

.ibar{position:fixed;left:0;right:0;bottom:0;z-index:11;display:flex;
  justify-content:space-between;align-items:flex-end;
  padding:26px 20px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,transparent,rgba(6,6,6,.88) 60%);
  pointer-events:none;transition:opacity .45s var(--ease);}
body.shot .ibar{opacity:0;}
.ro{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.ro.right{text-align:right;}
.ro b{font-weight:400;color:var(--accent);}

/* the shutter. a camera doesn't caption itself. */
.shutter{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);
  transform:translateX(-50%);z-index:14;
  width:66px;height:66px;border-radius:50%;border:1.5px solid rgba(236,228,212,.8);
  background:transparent;cursor:pointer;transition:opacity .3s var(--ease),transform .12s var(--ease);}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--frame);}
.shutter:active{transform:translateX(-50%) scale(.93);}
body.shot .shutter{opacity:0;pointer-events:none;}
@media (orientation:landscape){
  .shutter{left:auto;right:calc(env(safe-area-inset-right) + 26px);bottom:50%;
    transform:translateY(50%);}
  .shutter:active{transform:translateY(50%) scale(.93);}
}

/* ---------- the keepsake ----------
   Sits at the top, alone, because the broadsheet owns the bottom of the frame
   in portrait and the shutter owns the right edge in landscape. One position
   works in both, and it only ever exists after the shutter has fired. */
.save{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);
  transform:translateX(-50%);z-index:15;
  font-family:var(--sans);font-size:10px;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;color:var(--frame);
  padding:12px 24px;border-radius:999px;
  border:1px solid rgba(236,228,212,.38);background:rgba(6,6,6,.42);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .5s var(--ease),transform .12s var(--ease),color .3s var(--ease);}
/* only once the image is actually composed — a save button that isn't ready
   yet is worse than no button at all */
body.shot .save.ready{opacity:1;pointer-events:auto;}
.save:active{transform:translateX(-50%) scale(.95);}
.save.done{color:var(--muted);border-color:rgba(148,139,126,.3);pointer-events:none;}

/* the turn cue — encourage, never force */
.turn{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 122px);
  z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;transition:opacity .4s var(--ease);}
@media (orientation:landscape){ .turn{opacity:0;} }
body.shot .turn, body.asked .turn{opacity:0;pointer-events:none;}
.turn-glyph{width:15px;height:24px;border:1.5px solid var(--accent);border-radius:3px;}
.turn-label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);}
@media (prefers-reduced-motion:no-preference){
  .turn-glyph{animation:turnhint 3.2s var(--ease) infinite;}
  @keyframes turnhint{0%,42%{transform:rotate(0)}66%,88%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
}

/* ---------- BROADSHEET — after the shutter ---------- */
.scrim{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:4;
  background:linear-gradient(to top,rgba(6,6,6,.88),rgba(6,6,6,.4) 58%,transparent);
  opacity:0;transition:opacity .9s var(--ease);pointer-events:none;}
body.shot .scrim{opacity:1;}
@media (orientation:landscape){
  .scrim{inset:0;height:auto;background:linear-gradient(90deg,rgba(6,6,6,.8),rgba(6,6,6,.25) 55%,transparent);}
}

.phrase{position:absolute;left:7%;right:7%;bottom:9%;z-index:5;
  text-align:center;pointer-events:none;
  font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:clamp(24px,7vw,44px);line-height:1.02;letter-spacing:-.025em;
  color:var(--text-hi);text-shadow:0 1px 16px rgba(0,0,0,.75);
  opacity:0;transform:translateY(10px);
  transition:opacity 1s var(--ease),transform 1s var(--ease);}
body.shot .phrase{opacity:1;transform:translateY(0);}
@media (orientation:landscape){
  .phrase{left:10%;right:10%;bottom:auto;top:50%;
    transform:translateY(-50%) translateY(10px);font-size:clamp(24px,4.4vw,46px);}
  body.shot .phrase{transform:translateY(-50%);}
}

/* the rules wipe outward from the centre once the line has landed */
.rule{display:block;height:1px;margin:0 auto;background:rgba(246,239,223,.34);
  transform:scaleX(0);transform-origin:center;
  transition:transform 1.1s var(--ease) .35s;}
.rule-t{margin-bottom:18px;} .rule-b{margin-top:18px;}
body.shot .rule{transform:scaleX(1);}

.folio{display:block;margin-top:14px;font-family:var(--sans);font-style:normal;
  font-weight:500;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(246,239,223,.5);opacity:0;transition:opacity .9s var(--ease) .6s;}
body.shot .folio{opacity:1;}

/* ---------- the veil. iOS needs a gesture before the camera opens. ---------- */
.veil{position:fixed;inset:0;z-index:60;background:var(--void);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:opacity .9s var(--ease);}
.veil.gone{opacity:0;pointer-events:none;}
.veil-in{text-align:center;}
/* the sign IS the instruction. it's the 4-pane device and a phone at once, and
   it turns — so the flip happens BEFORE the camera opens and the shade lifts
   into a full landscape frame. the gesture iOS demands becomes the ritual. */
.glyph{width:52px;height:84px;margin:0 auto 26px;position:relative;
  border:1.5px solid var(--frame);border-radius:5px;
  transition:transform .7s var(--ease), width .7s var(--ease), height .7s var(--ease);}
.glyph::before,.glyph::after{content:"";position:absolute;background:var(--frame);opacity:.9;}
.glyph::before{left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;}
.glyph::after{top:50%;left:0;right:0;height:1.5px;margin-top:-.75px;}
@media (prefers-reduced-motion:no-preference){
  body:not(.turned) .glyph{animation:flipsign 3.4s var(--ease) infinite;}
  @keyframes flipsign{
    0%,38%{transform:rotate(0)}
    62%,86%{transform:rotate(-90deg)}
    100%{transform:rotate(0)}
  }
}
/* once the phone is actually sideways the sign settles and grows into the
   landscape shape — the reward, stated before you've even opened it */
body.turned .glyph{animation:none;transform:none;width:96px;height:64px;}

.veil-in p{font-family:var(--mono);font-size:10px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--muted);
  transition:opacity .4s var(--ease);}
.veil-in .sub{margin-top:10px;font-size:9px;letter-spacing:.28em;color:var(--accent);}
body.turned .veil-in .sub{opacity:0;}
.veil-in .go{opacity:0;margin-top:10px;font-size:9px;letter-spacing:.28em;color:var(--accent);}
body.turned .veil-in .go, body.asked .veil-in .go{opacity:1;}

.err{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;}
.err.show{display:flex;}
.err p{font-size:14px;color:var(--muted);max-width:22em;line-height:1.6;}
.err button{font-family:var(--sans);font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;padding:12px 22px;border:1px solid var(--frame);
  background:transparent;color:var(--frame);border-radius:999px;cursor:pointer;}
</style>
</head>
<body>

<div id="stage">
  <div class="window">
    <div class="glass">
      <video id="cam" autoplay playsinline muted></video>
      <img id="freeze" alt="">
      <div class="shade" id="shade"></div>
      <div class="flash" id="flash"></div>
    </div>

    <!-- instrument: hairline, nothing over the shot -->
    <div class="guide"></div>
    <div class="sill"></div>
    <div class="mull mull-v"></div>
    <div class="mull mull-h"></div>
    <div class="ticks"></div>

    <!-- broadsheet: type takes over the instant it freezes -->
    <div class="scrim"></div>
    <div class="phrase">
      <span class="rule rule-t"></span>
      <span id="line"></span>
      <span class="rule rule-b"></span>
      <span class="folio" id="folio"></span>
    </div>
  </div>
</div>

<div class="turn"><span class="turn-glyph"></span><span class="turn-label">turn it sideways</span></div>

<div class="ibar">
  <div class="ro"><span>outside</span><b id="clock">—</b></div>
  <div class="ro right"><span>frame</span><b id="frame">1 / 24</b></div>
</div>

<button class="shutter" id="shoot" aria-label="take the window"></button>
<button class="save" id="save">save</button>

<div class="veil" id="veil">
  <div class="veil-in">
    <div class="glyph"></div>
    <p id="veil-line">turn it sideways</p>
    <p class="sub">the window gets bigger</p>
    <p class="go">tap to open</p>
  </div>
</div>

<div class="err" id="err">
  <p>this needs the camera. allow access, then try again.</p>
  <button id="retry">try again</button>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);

  /* The banks. Always random, never chosen — the line is a gift you didn't
     pick, so it lands as a surprise on every take.

     Register: push, never scold. 0003 says this is a bouncer they hired, not
     a nag — so these give permission and momentum, and none of them imply the
     user failed. Spanish is Chilean, not neutral LATAM: the launch market
     should hear its own voice, not a dubbed one. */
  const BANK = {
    en: [
      "put it down, it'll still be here",
      "go be somewhere",
      "the day is not going to wait",
      "nothing out here is trying to sell you anything",
      "you already know what you should be doing",
      "go make something instead",
      "this is the part where you get up",
      "the work is out there, not in here",
      "unplug, the feed survives without you",
      "go get your hours in",
      "look far away for a second",
      "you don't owe the scroll anything",
      "somebody's outside right now, be them",
      "close it, you've got things",
      "the grind is real, the feed is not",
      "go outside and be unreachable",
      "you came here to look, so look",
      "one hour off this is one hour of your life back",
      "go do the thing you keep postponing",
      "nobody made anything good while scrolling",
      "the sky is free and it's right there",
      "step out, come back sharper",
      "this is your sign, obviously",
      "go touch something real"
    ],
    es: [
      "déjalo, no se va a ir a ningún lado",
      "anda a estar en alguna parte",
      "el día no te va a esperar",
      "acá afuera nadie te está vendiendo nada",
      "ya sabís lo que tenís que hacer",
      "anda a hacer algo mejor",
      "esta es la parte donde te paras",
      "la pega está allá afuera, no acá",
      "desenchúfate, el feed sobrevive sin ti",
      "anda a hacer tus horas",
      "mira lejos un rato",
      "no le debís nada al scroll",
      "alguien está afuera ahora, sé esa persona",
      "ciérralo, tenís cosas",
      "la pega es real, el feed no",
      "sal y desaparece un rato",
      "viniste a mirar, entonces mira",
      "una hora menos acá es una hora más tuya",
      "anda a hacer eso que vení postergando",
      "nadie hizo nada bueno scrolleando",
      "el cielo es gratis y está ahí",
      "sal un rato, vuelve más despierto",
      "esta es tu señal, obvio",
      "anda a tocar algo real"
    ]
  };

  /* Chile ships first, so Spanish is the default for any es-* device.
     ?lang=en / ?lang=es forces it, which is what filming needs. */
  const LANG = (() => {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "es") return q;
    return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
  })();
  const LINES = BANK[LANG];
  document.documentElement.lang = LANG;
  const ROLL = 24;
  const rollN = () => {
    const n = parseInt(localStorage.getItem("moment-roll") || "0", 10);
    return isNaN(n) ? 0 : n;
  };

  /* don't repeat inside a filming session, or takes start echoing */
  let recent = [];
  function nextLine(){
    const fresh = LINES.filter(l => !recent.includes(l));
    const pool = fresh.length ? fresh : LINES;
    const line = pool[Math.floor(Math.random() * pool.length)];
    recent = [line, ...recent].slice(0, Math.floor(LINES.length / 2));
    return line;
  }

  const state = { stream:null, shot:false, resetT:null, file:null, take:0 };

  /* the button speaks whatever language the phrases are in */
  const SAVE_COPY = LANG === "es"
    ? { idle:"guardar", done:"guardada" }
    : { idle:"save",    done:"saved" };

  /* ============================================================
     THE KEEPSAKE

     iOS has exactly one route from a web page into the camera roll: the native
     share sheet with a file attached, where "Save Image" appears. A download
     link lands in Files, not Photos — so the sheet IS the mechanism, and the
     fallback below only ever fires on desktop.

     The image is composed the INSTANT the shutter fires and held ready,
     because navigator.share has to be called straight out of the tap. Awaiting
     a canvas encode inside the handler spends the user gesture and the sheet
     then silently never opens.

     What gets saved is the frame as shot — 3:2, phrase burned in. Not a social
     crop: 0017 made the capture landscape for the contact sheet, so this is the
     negative, and the open 9:16-vs-4:5 question stays where it belongs, at the
     share sheet in the real app rather than pre-answered here.
     ============================================================ */
  async function readyFonts(){
    if(!document.fonts) return;
    try{
      await Promise.all([
        document.fonts.load("italic 500 76px Fraunces"),
        document.fonts.load("500 21px 'Hanken Grotesk'")
      ]);
      await document.fonts.ready;
    }catch(e){ /* degrades to Georgia / system — still legible */ }
  }

  function wrap(ctx, text, maxW){
    const words = (text || "").split(/\s+/);
    const lines = []; let line = "";
    for(const w of words){
      const test = line ? line + " " + w : w;
      if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    }
    if(line) lines.push(line);
    return lines;
  }

  /* canvas letterSpacing only landed in Safari 17.4, and the folio is the one
     place the instrument voice has to survive. Draw it a glyph at a time. */
  function tracked(ctx, text, cx, y, track){
    const chars = [...text];
    let w = -track;
    for(const ch of chars) w += ctx.measureText(ch).width + track;
    const prev = ctx.textAlign;
    ctx.textAlign = "left";
    let x = cx - w / 2;
    for(const ch of chars){ ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + track; }
    ctx.textAlign = prev;
  }

  async function keepsake(frame, phrase, shotNo){
    await readyFonts();
    const W = 1620, H = 1080;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const ctx = c.getContext("2d");

    ctx.fillStyle = "#0B0B0B"; ctx.fillRect(0, 0, W, H);
    if(frame) ctx.drawImage(frame, 0, 0, W, H);

    /* the same scrim the screen showed */
    const g = ctx.createLinearGradient(0, H * .42, 0, H);
    g.addColorStop(0,   "rgba(6,6,6,0)");
    g.addColorStop(.58, "rgba(6,6,6,.44)");
    g.addColorStop(1,   "rgba(6,6,6,.90)");
    ctx.fillStyle = g;
    ctx.fillRect(0, H * .42, W, H * .58);

    ctx.textAlign = "center";
    ctx.fillStyle = "#F6EFDF";
    const maxW = W * .76;
    let size = 76;
    ctx.font = `italic 500 ${size}px Fraunces, Georgia, serif`;
    let lines = wrap(ctx, phrase, maxW);
    while(lines.length > 3 && size > 46){
      size -= 6;
      ctx.font = `italic 500 ${size}px Fraunces, Georgia, serif`;
      lines = wrap(ctx, phrase, maxW);
    }

    const lh        = size * 1.06;
    const footY     = H - 58;
    const lastBase  = footY - 74;
    const firstBase = lastBase - (lines.length - 1) * lh;
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, firstBase + i * lh));

    /* the two hairline rules, set to the widest line */
    const widest = Math.max.apply(null, lines.map(l => ctx.measureText(l).width));
    const ruleW  = Math.min(maxW, widest + size * .6);
    ctx.fillStyle = "rgba(246,239,223,.34)";
    ctx.fillRect(W / 2 - ruleW / 2, firstBase - size * .96 - 28, ruleW, 1.5);
    ctx.fillRect(W / 2 - ruleW / 2, lastBase + 30, ruleW, 1.5);

    ctx.font = `500 21px 'Hanken Grotesk', system-ui, sans-serif`;
    ctx.fillStyle = "rgba(246,239,223,.52)";
    tracked(ctx, `UCCO · FRAME ${shotNo} OF ${ROLL}`, W / 2, footY, 5);

    return new Promise(res => c.toBlob(res, "image/jpeg", .92));
  }

  function stamp(){
    const d = new Date(), p = n => String(n).padStart(2, "0");
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  async function save(e){
    e.stopPropagation();          /* a tap on the stage resets — this one must not */
    const f = state.file;
    if(!f) return;
    const btn = $("#save");
    /* the sheet backgrounds the page; never let the reset fire underneath it */
    clearTimeout(state.resetT);
    try{
      if(navigator.canShare && navigator.canShare({ files:[f] })){
        await navigator.share({ files:[f] });
      }else{
        const url = URL.createObjectURL(f);
        const a = document.createElement("a");
        a.href = url; a.download = f.name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      btn.textContent = SAVE_COPY.done;
      btn.classList.add("done");
    }catch(err){
      /* AbortError — they backed out of the sheet. say nothing, offer it again. */
    }
    /* give the take its reset back either way, so filming stays hands-free */
    clearTimeout(state.resetT);
    state.resetT = setTimeout(reset, 4200);
  }

  function paintBar(){
    const n = rollN();
    $("#frame").textContent = ((n % ROLL) + 1) + " / " + ROLL;
    const d = new Date();
    $("#clock").textContent =
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  async function startCamera(){
    /* never re-request over a live stream — see trackLive() below */
    if(trackLive()) return true;
    stopCamera();
    try{
      state.stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:"environment" }, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
      $("#cam").srcObject = state.stream;
      $("#err").classList.remove("show");
      return true;
    }catch(e){
      $("#err").classList.add("show");
      return false;
    }
  }
  function stopCamera(){
    if(state.stream){ state.stream.getTracks().forEach(t => t.stop()); state.stream = null; }
  }

  async function open(){
    const ok = await startCamera();
    $("#veil").classList.add("gone");
    if(!ok) return;
    paintBar();
    /* the shade lifts — the hero beat, and the reason to film the open */
    setTimeout(() => $("#shade").classList.add("open"), 260);
    /* the turn cue asks once and then stops. with rotation lock on the screen
       never goes landscape, and a cue that nags forever is worse than none. */
    setTimeout(() => document.body.classList.add("asked"), 6000);
  }

  function shoot(){
    if(state.shot) return;
    const v = $("#cam");
    if(!v.videoWidth) return;

    /* freeze the exact frame, matched to the window's 3:2 crop */
    const c = document.createElement("canvas");
    const side = Math.min(v.videoWidth, v.videoHeight * 1.5);
    c.width = Math.min(1620, side);
    c.height = Math.round(c.width / 1.5);
    const sw = v.videoHeight * 1.5 <= v.videoWidth ? v.videoHeight * 1.5 : v.videoWidth;
    const sh = sw / 1.5;
    c.getContext("2d").drawImage(v,
      (v.videoWidth - sw)/2, (v.videoHeight - sh)/2, sw, sh, 0, 0, c.width, c.height);

    $("#freeze").src = c.toDataURL("image/jpeg", .92);
    $("#freeze").classList.add("show");
    $("#flash").classList.add("fire");
    setTimeout(() => $("#flash").classList.remove("fire"), 460);

    const n = rollN() + 1;
    localStorage.setItem("moment-roll", String(n));
    const shotNo = ((n - 1) % ROLL) + 1;

    const line = nextLine();
    $("#line").textContent = line;
    $("#folio").textContent = "frame " + shotNo + " of " + ROLL;

    state.shot = true;
    document.body.classList.add("shot");

    /* compose the keepsake now, so the save tap has a file already waiting */
    const take = ++state.take;
    state.file = null;
    keepsake(c, line, shotNo).then(blob => {
      if(!blob || take !== state.take) return;   /* a newer take owns the screen */
      state.file = new File([blob], "ucco-" + stamp() + ".jpg", { type:"image/jpeg" });
      $("#save").classList.add("ready");
    }).catch(function(){ /* no save offered, the take is unaffected */ });

    /* it resets itself so takes run back to back, hands-free. this is the
       whole reason the file exists — the extra beat is room to reach save. */
    clearTimeout(state.resetT);
    state.resetT = setTimeout(reset, 6000);
  }

  function reset(){
    state.shot = false;
    state.file = null;
    state.take++;                       /* orphan any composite still encoding */
    const btn = $("#save");
    btn.classList.remove("ready", "done");
    btn.textContent = SAVE_COPY.idle;
    document.body.classList.remove("shot");
    $("#freeze").classList.remove("show");
    $("#shade").classList.remove("open");
    paintBar();
    setTimeout(() => $("#shade").classList.add("open"), 420);
  }

  $("#veil").onclick = open;
  $("#shoot").onclick = shoot;
  $("#save").onclick = save;
  $("#save").textContent = SAVE_COPY.idle;
  $("#retry").onclick = () => { $("#err").classList.remove("show"); open(); };
  /* tap the frozen photo to move on early instead of waiting out the reset */
  $("#stage").onclick = () => { if(state.shot){ clearTimeout(state.resetT); reset(); } };

  /* the sign watches the phone. once it's actually sideways the glyph settles
     into the landscape shape and the copy switches to the tap. */
  const land = window.matchMedia("(orientation: landscape)");
  function readTurn(){
    const on = land.matches;
    document.body.classList.toggle("turned", on);
    const l = $("#veil-line");
    if (l) l.textContent = on ? "tap to open" : "turn it sideways";
  }
  if (land.addEventListener) land.addEventListener("change", readTurn);
  else land.addListener(readTurn);
  readTurn();

  /* never a trap: if the phone never turns — rotation lock, a case, a table —
     the tap becomes available on its own after a few seconds. */
  setTimeout(() => document.body.classList.add("asked"), 4500);

  window.addEventListener("orientationchange", () => setTimeout(() => { paintBar(); readTurn(); }, 300));
  /* Only re-acquire when the track is genuinely dead. Calling getUserMedia a
     second time while a stream is live kills the first one
     (webkit.org/show_bug.cgi?id=179363) — which is what made the camera glitch
     and re-pick on every flip. Rotating must never touch the stream. */
  function trackLive(){
    const t = state.stream && state.stream.getVideoTracks()[0];
    return !!t && t.readyState === "live";
  }
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "visible") return;
    if(state.shot || !$("#veil").classList.contains("gone")) return;
    /* WebKit mutes capture on background and restarts it on return by itself.
       Give it a beat, and only step in if the track actually ended. */
    setTimeout(() => { if(!trackLive()) startCamera(); }, 400);
  });

  paintBar();

  /* If the automation deep-links straight in, try to open without the tap.
     Safari will usually refuse without a gesture, and then the veil is the
     fallback rather than a dead end. */
  if(new URLSearchParams(location.search).has("auto")) open();
})();
</script>
</body>
</html>
